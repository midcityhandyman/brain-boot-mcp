[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-boot-mcp"
version = "0.1.0"
description = "MCP server that gives any agent a boot pack at session start: standing rules, recent human corrections, due items and a pack id."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
brain-boot-mcp = "brain_boot_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
